name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare
        run: npm run build:cf

      - name: Prepare deployment
        run: |
          mkdir -p .deploy
          cp .open-next/worker.js .deploy/_worker.js
          cp -r .open-next/assets/* .deploy/
          cp -r .open-next/cloudflare .deploy/
          cp -r .open-next/middleware .deploy/
          cp -r .open-next/server-functions .deploy/
          cp -r .open-next/.build .deploy/
          cp -r .open-next/cache .deploy/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .deploy --project-name=dulra --commit-dirty=true
